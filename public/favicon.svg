<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <rect width="32" height="32" rx="8" fill="url(#grad)"/>
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
  </defs>
  <!-- Warehouse roof -->
  <path d="M4 14L16 6L28 14" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Warehouse body -->
  <rect x="6" y="14" width="20" height="14" rx="2" stroke="white" stroke-width="2" fill="none"/>
  <!-- Door -->
  <rect x="12" y="20" width="8" height="8" rx="1" stroke="white" stroke-width="1.5" fill="none"/>
  <!-- Shelves inside -->
  <line x1="12" y1="22" x2="20" y2="22" stroke="white" stroke-width="1" opacity="0.6"/>
  <line x1="12" y1="25" x2="20" y2="25" stroke="white" stroke-width="1" opacity="0.6"/>
  <!-- Vent -->
  <circle cx="22" cy="17" r="1.5" stroke="white" stroke-width="1" fill="none"/>
</svg>
